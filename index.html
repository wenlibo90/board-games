<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="中国象棋、韩国象棋、日本将棋、国际象棋、围棋、国际跳棋、六角跳棋、五子棋、黑白棋、斗兽棋，以及 UNO、升级/拖拉机、掼蛋、斗地主，在线对弈，内置本地 AI 与新手教学。" />
  <title>弈趣棋坊 · 多棋类在线对弈与新手教学</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <link rel="stylesheet" href="./assets/skins.css" />
</head>
<body>
  <header class="topbar">
    <button type="button" class="brand" id="btn-home" aria-label="返回首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28">
          <rect x="3" y="3" width="26" height="26" rx="7" fill="#0f766e" opacity="0.12" />
          <circle cx="12" cy="16" r="7" fill="#161616" />
          <circle cx="20" cy="16" r="7" fill="#f7f3e9" stroke="#cbbfa5" />
        </svg>
      </span>
      <span class="brand-text">
        <strong>弈趣棋坊</strong>
        <span>棋类与牌类 · 本地 AI · 新手教学</span>
      </span>
    </button>

    <nav id="game-tabs" class="mode-switch is-hidden" aria-label="模式切换">
      <button type="button" data-tab="play" class="is-active">对弈</button>
      <button type="button" data-tab="tutorial">新手教学</button>
    </nav>

    <div class="topbar-actions">
      <button type="button" id="theme-toggle" class="icon-btn" aria-label="切换明暗主题">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" />
        </svg>
      </button>
    </div>
  </header>

  <main class="page">
    <!-- 首页 -->
    <section id="home-view">
      <div class="home-hero">
        <h1>多棋种在线对弈</h1>
        <p>中国象棋、韩国象棋、日本将棋、国际象棋、围棋、国际跳棋、六角跳棋、五子棋、黑白棋、斗兽棋，以及 UNO、升级/拖拉机、掼蛋、斗地主，全部内置本地 AI 与新手教学。</p>
      </div>
      <div id="home-grid" class="home-grid"></div>
    </section>

    <!-- 棋局视图 -->
    <section id="game-view" class="is-hidden">
      <div id="custom-page-host" class="is-hidden"></div>
      <div class="game-header">
        <h1 id="game-title"></h1>
        <p id="game-tagline"></p>
      </div>

      <div id="play-panel">
        <div class="game-layout">
          <div class="board-panel">
            <div class="board-frame" id="board-frame">
              <canvas id="game-canvas" class="board-canvas" aria-label="棋盘"></canvas>
            </div>
            <div id="result-banner" class="result-banner is-hidden" role="status" aria-live="polite">
              <span id="result-text"></span>
            </div>
          </div>
          <aside class="side-panel" id="side-panel"></aside>
        </div>
      </div>

      <div id="tutorial-panel" class="is-hidden">
        <div id="tutorial-host"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>弈趣棋坊 · 14 款棋牌 · 本地 AI · 无需联网</span>
  </footer>

  <script type="module" src="./src/app.js?v=20"></script>
</body>
</html>
